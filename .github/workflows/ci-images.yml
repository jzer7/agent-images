name: CI Images

on:
  push:
    paths:
      - '.github/workflows/ci-images.yml'
      - '.tool-versions'
      - '**/Dockerfile'
      - '**/Makefile'
      - 'assets/**'
      - 'Makefile'
      - 'rules/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/workflows/ci-images.yml'
      - '.tool-versions'
      - '**/Dockerfile'
      - '**/Makefile'
      - 'assets/**'
      - 'Makefile'
      - 'rules/**'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  discover-targets:
    name: Discover image test targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Discover directories with Dockerfile
        id: set-targets
        run: |
          targets=$(find . -mindepth 2 -maxdepth 2 -name Dockerfile -exec dirname {} + | sed 's|^\./||' | grep -v '^base$' | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "targets=${targets}" >> "$GITHUB_OUTPUT"

  image-qa:
    name: Container image QA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Install pinned QA tools
        run: |
          make install-tools-images
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run linting checks
        run: |
          make lint

      - name: Verify files are properly formatted
        run: |
          make format-check

  image-test-base:
    name: Test (base)
    runs-on: ubuntu-latest
    needs: [image-qa]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: Run tests
        env:
          BUILDX_EXTRA_ARGS: "--cache-from=type=gha,scope=buildx-base --cache-to=type=gha,scope=buildx-base,mode=max"
        run: make test-base

  image-test:
    name: Test (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: [discover-targets, image-test-base]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-targets.outputs.targets) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # https://github.com/docker/setup-buildx-action/releases/tag/v4.4.1

      - name: Run tests
        env:
          BUILDX_EXTRA_ARGS: "--cache-from=type=gha,scope=buildx-${{ matrix.target }} --cache-from=type=gha,scope=buildx-base --cache-to=type=gha,scope=buildx-${{ matrix.target }},mode=max"
        run: make test-${{ matrix.target }}
