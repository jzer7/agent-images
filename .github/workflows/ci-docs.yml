name: CI Docs

on:
  push:
    paths:
      - '.github/workflows/ci-docs.yml'
      - '.tool-versions'
      - '**/*.md'
      - 'Makefile'
      - 'rules/**'
  pull_request:
    paths:
      - '.github/workflows/ci-docs.yml'
      - '.tool-versions'
      - '**/*.md'
      - 'Makefile'
      - 'rules/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-qa:
    name: Markdown QA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # https://github.com/actions/checkout/releases/tag/v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # https://github.com/actions/setup-node/releases/tag/v7.0.0
        with:
          node-version: 'lts/*'

      - name: Install pinned QA tools
        run: |
          make install-tools-docs
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint markdown files
        run: make md-lint

      - name: Verify files are properly formatted
        run: |
          make md-format-check
